apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      environment: dev
      project: roboshop
      component: redis
  template:
    metadata:
      labels:
        environment: dev
        project: roboshop
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: redis
spec:
  selector:
    environment: dev
    project: roboshop
    component: redis
  ports:
    - protocol: TCP
      port: 6379 # service port
      targetPort: 6379 # container port