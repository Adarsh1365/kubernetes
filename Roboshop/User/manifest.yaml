apiVersion: v1
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: user
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
  REDIS_URL: "redis://redis:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: user
spec:
  selector:
    environment: dev
    project: roboshop
    component: user
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      environment: dev
      project: roboshop
      component: user
  template:
    metadata:
      labels:
        environment: dev
        project: roboshop
        component: user
    spec:
      containers:
        - name: user
          image: adarshupputuri/roboshop:user
          envFrom:
            - configMapRef:
                name: user



