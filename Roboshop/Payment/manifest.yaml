apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: payment
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment
  namespace: roboshop
type: Opaque
data:
  AMQP_USER: cm9ib3Nob3AK
  AMQP_PASS: cm9ib3Nob3AxMjMK

---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: payment
spec:
  selector:
    environment: dev
    project: roboshop
    component: payment
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      environment: dev
      project: roboshop
      component: payment
  template:
    metadata:
      labels:
        environment: dev
        project: roboshop
        component: payment
    spec:
      containers:
        - name: shipping
          image: adarshupputuri/roboshop:payment
          envFrom:
            - configMapRef:
                name: payment
            - secretRef:
                name: payment



