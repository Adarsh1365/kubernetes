apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: catalogue
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    environment: dev
    project: roboshop
    component: catalogue
spec:
  selector:
    environment: dev
    project: roboshop
    component: catalogue
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels:
      environment: dev
      project: roboshop
      component: catalogue
  template:
    metadata:
      labels:
        environment: dev
        project: roboshop
        component: catalogue
    spec:
      containers:
        - name: catalogue
          image: adarshupputuri/roboshop:catalogue



