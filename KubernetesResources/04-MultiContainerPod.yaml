apiVersion: v1
kind: Pod
metadata:
    name: multi-container-pod
    namespace: roboshop
    labels:
        environment: dev
        project: roboshop
        poc: roboshop
spec:
    containers:
        - name: nginx
          image: nginx:latest
        - name: almalinux
          image: almalinux:latest
          command: ["sleep", "30"]