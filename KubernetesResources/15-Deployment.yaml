apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: roboshop
spec:
  replicas: 5
  selector:
    matchLabels:
      environment: dev
      project: roboshop
      tier: frontend
      purpose: deployment
  template:
    metadata:
      labels:
        environment: dev
        project: roboshop
        tier: frontend
        purpose: deployment
    spec:
      containers:
        - name: nginx-frontend
          image: nginx:latest
          ports:
            - containerPort: 80
