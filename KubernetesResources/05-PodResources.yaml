apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  labels:
        app: nginx
  namespace: roboshop
  spec:
    containers:
      - name: nginx-container
        image: nginx:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"